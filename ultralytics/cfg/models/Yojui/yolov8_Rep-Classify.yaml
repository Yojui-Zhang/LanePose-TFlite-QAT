# Ultralytics YOLOv8-cls image classification model with YOLO backbone
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/classify

# Parameters
nc: 18 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]

  n: [1, 1.0, 128]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [8, 3, 2]]                             # 0
  - [-1, 1, DWConv, [16, 3, 2]]                          # 1
  - [-1, 1, RepVGGBlock, [16, True]]                     # 2
#   - [-1, 1, CBAM, [16]]                                
  
  - [-1, 1, DWConv, [32, 3, 2]]                          # 3
  - [-1, 1, RepVGGBlock, [32, True]]
  - [-1, 1, CBAM, [32]]
  
  - [-1, 1, DWConv, [64, 3, 2]]                          # 5
  - [-1, 2, RepVGGBlock, [64, True]]
  - [-1, 1, CBAM, [64]] 
  
  - [-1, 1, DWConv, [128, 3, 2]]                         # 8
  - [-1, 2, RepVGGBlock, [128, True]]
  - [-1, 1, CBAM, [128]] 

head:
  - [-1, 1, Classify, [nc]] # Classify
